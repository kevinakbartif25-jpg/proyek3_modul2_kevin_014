<!-- index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Interactive Profile Card</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <button id="toggle-tema">Ganti Tema</button>

  <div id="status"></div>
  <button id="coba-lagi" hidden>Coba Lagi</button>

  <div id="profil" hidden>
    <h1 id="nama"></h1>
    <p id="bio"></p>

    <button id="toggle-detail" aria-expanded="false">Lihat Detail</button>
    <div id="detail" hidden>
      <p id="email"></p>
      <p id="lokasi"></p>
    </div>

    <section id="section-keterampilan">
      <h2>Keterampilan</h2>
      <ul id="daftar-keterampilan"></ul>
      <p id="kosong" hidden>Belum ada keterampilan</p>

      <form id="form-keterampilan">
        <input id="input-keterampilan" type="text" placeholder="Tambah keterampilan">
        <span id="error-input" hidden>Input tidak boleh kosong</span>
        <button type="submit">Tambah</button>
      </form>
    </section>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
